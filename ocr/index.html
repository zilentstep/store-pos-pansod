<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANSOD OCR - Receipt Scanner</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .ocr-container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .upload-card { background: var(--bg-surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border-default); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border-light); text-align: left; }
        .edit-input { width: 100%; padding: 5px; border: 1px solid var(--border-default); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="pin-screen" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>Enter PIN</h2>
            <input type="password" id="pin-input" maxlength="4">
            <button id="pin-submit">Unlock</button>
        </div>
    </div>

    <div class="ocr-container">
        <h1>Receipt Scanner</h1>
        <div class="upload-card">
            <input type="file" id="image-upload" accept="image/png,image/jpeg,application/pdf">
            <button id="process-btn">Process Receipt</button>
        </div>
        <div id="results-area" style="display:none;">
            <div class="upload-card">
                <h3>Extracted Data</h3>
                <input type="text" id="supplier-name" placeholder="Supplier Name" class="edit-input">
                <input type="date" id="bill-date" class="edit-input">
                <table id="items-table">
                    <thead>
                        <tr>
                            <th>Item</th><th>Qty</th><th>Price</th><th>Category</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button id="save-btn" class="accent">Save to Database</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
